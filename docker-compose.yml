services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daymark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: taskmanagerdemoapplicationtest123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
